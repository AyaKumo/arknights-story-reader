<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>README</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            background-color: #000000;
            color: #ffffff;
        }
        .dialogue {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
        }
        .avatar-container {
            width: 80px;
            height: 80px;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .avatar {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* 回忆/过去场景的灰度效果 */
        .dialogue.grayscale .avatar {
            filter: grayscale(100%);
        }
        .dialogue.grayscale .name {
            color: #aaaaaa;
        }
        .dialogue.grayscale .text {
            color: #999999;
        }
        .dialogue-content {
            flex: 1;
        }
        .name {
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 5px;
        }
        .text {
            color: #eeeeee;
        }
        .narration {
            font-style: italic;
            color: #cccccc;
            margin: 15px 0;
        }
        h1 {
            color: #ffffff;
        }
        .section-break {
            margin: 30px 0;
            border-top: 1px solid #333;
        }
        .cg-container {
            width: 100%;
            max-width: 100%;
            margin: 25px 0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            opacity: 0;
            animation: cgFadeIn var(--fade-duration, 0.5s) ease-out forwards;
        }
        .cg-image {
            display: block;
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }
        @keyframes cgFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        .back-to-index {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #333;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
        }
        /* 玩家选项 Decision / 分支 Predicate */
        .player-decision {
            margin: 18px 0;
            padding: 12px 14px;
            border-left: 3px solid #00d2ff;
            background: rgba(0, 210, 255, 0.08);
            border-radius: 0 6px 6px 0;
        }
        .player-decision-title {
            font-size: 0.72rem;
            letter-spacing: 3px;
            color: #00d2ff;
            margin-bottom: 10px;
        }
        .decision-option {
            margin: 6px 0;
            color: #eeeeee;
            line-height: 1.5;
        }
        .decision-value {
            display: inline-block;
            min-width: 2em;
            color: #888;
            font-family: Consolas, monospace;
            font-size: 0.82rem;
            margin-right: 6px;
        }
        .branch-predicate {
            margin: 14px 0 8px 0;
            padding: 8px 12px;
            border-left: 2px solid #555;
            background: rgba(255, 255, 255, 0.04);
            font-size: 0.88rem;
            color: #bbbbbb;
            line-height: 1.45;
        }
        .branch-label {
            display: block;
        }
        /* Sticker 说话人 + 咒语 spellsticker */
        .spell-with-speaker {
            margin: 18px 0;
        }
        .spell-with-speaker .name {
            margin-bottom: 10px;
        }
        /* 咒语 spellsticker：<p=n> 多段文本 */
        .spell-incantation {
            margin: 20px 0;
            padding: 16px 18px;
            border-left: 3px solid #c9a227;
            background: rgba(201, 162, 39, 0.07);
            border-radius: 0 8px 8px 0;
        }
        .spell-line {
            font-weight: 700;
            font-family: "Palatino Linotype", Palatino, "Book Antiqua",
                "STSong", "SimSun", "Times New Roman", serif;
            font-size: 1.06rem;
            line-height: 1.65;
            color: #f2e8d8;
            letter-spacing: 0.05em;
        }
        .spell-line + .spell-line {
            margin-top: 12px;
        }
        .chapter-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 6px 0 22px 0;
            padding-right: 120px;
            box-sizing: border-box;
        }
        .chapter-nav-bottom {
            margin: 36px 0 16px 0;
            padding-top: 22px;
            border-top: 1px solid #333;
            padding-right: 0;
        }
        .chapter-nav-btn {
            display: inline-block;
            padding: 10px 18px;
            background: #1a1a1a;
            color: #f0f0f0;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid #3a3a3a;
            font-size: 0.92rem;
            transition: border-color 0.2s, color 0.2s;
        }
        .chapter-nav-btn:hover:not(.disabled) {
            border-color: #00d2ff;
            color: #00d2ff;
        }
        .chapter-nav-btn.disabled {
            opacity: 0.32;
            cursor: not-allowed;
        }
        @media (max-width: 560px) {
            .chapter-nav { padding-right: 0; margin-top: 48px; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-to-index">返回目录</a>
    <h1>README</h1>
    <nav class="chapter-nav" aria-label="章节导航">
        <a class="chapter-nav-btn" href="level_st_17-04.html">← 上一章</a>
        <span class="chapter-nav-btn disabled" aria-disabled="true">下一章 →</span>
    </nav>
    <div class="story-container">
        <div class="narration"># arknights-story-reader</div>
    <nav class="chapter-nav chapter-nav-bottom" aria-label="章节导航（页尾）">
        <a class="chapter-nav-btn" href="level_st_17-04.html">← 上一章</a>
        <span class="chapter-nav-btn disabled" aria-disabled="true">下一章 →</span>
    </nav>
    </div>
</body>
</html>
