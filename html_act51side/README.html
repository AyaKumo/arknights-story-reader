<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>README</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            background-color: #000000;
            color: #ffffff;
        }
        .dialogue {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
        }
        .avatar-container {
            width: 80px;
            height: 80px;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .avatar {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .dialogue-content {
            flex: 1;
        }
        .name {
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 5px;
        }
        .text {
            color: #eeeeee;
        }
        .narration {
            font-style: italic;
            color: #cccccc;
            margin: 15px 0;
        }
        h1 {
            color: #ffffff;
        }
        .section-break {
            margin: 30px 0;
            border-top: 1px solid #333;
        }
        .back-to-index {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #333;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-to-index">返回目录</a>
    <h1>README</h1>
    <div class="story-container">
        <div class="narration"># arknights-story-reader</div>
    </div>
</body>
</html>
