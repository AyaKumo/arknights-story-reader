<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>故事目录</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .menu-container {
            position: relative;
            width: 80px;
            height: 80px;
            cursor: pointer;
        }
        .menu-icon {
            width: 100%;
            height: 100%;
            background-color: #333;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            transition: transform 0.3s;
        }
        .menu-items {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s;
        }
        .menu-container.active .menu-items {
            width: 500px;
            height: 500px;
            opacity: 1;
            visibility: visible;
        }
        .menu-container.active .menu-icon {
            transform: rotate(45deg);
        }
        .menu-item {
            position: absolute;
            background-color: #444;
            color: white;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            transition: all 0.3s;
            transform: translate(-50%, -50%);
            opacity: 0;
        }
        .menu-container.active .menu-item {
            opacity: 1;
        }
        .menu-item:hover {
            background-color: #666;
            transform: translate(-50%, -50%) scale(1.1);
        }
    </style>
</head>
<body>
    <div class="menu-container" id="menu">
        <div class="menu-icon">+</div>
        <div class="menu-items">
            <a href="level_act19mini_st01.html" class="menu-item" style="transform: translate(calc(-50% + 400px), calc(-50% + 0px))">活动19mini_st01</a>
            <a href="level_act19mini_st02.html" class="menu-item" style="transform: translate(calc(-50% + 249px), calc(-50% + 312px))">活动19mini_st02</a>
            <a href="level_act19mini_st03.html" class="menu-item" style="transform: translate(calc(-50% + -89px), calc(-50% + 389px))">活动19mini_st03</a>
            <a href="level_act19mini_st04.html" class="menu-item" style="transform: translate(calc(-50% + -360px), calc(-50% + 173px))">活动19mini_st04</a>
            <a href="level_act19mini_st05.html" class="menu-item" style="transform: translate(calc(-50% + -360px), calc(-50% + -173px))">活动19mini_st05</a>
            <a href="level_act19mini_st06.html" class="menu-item" style="transform: translate(calc(-50% + -89px), calc(-50% + -389px))">活动19mini_st06</a>
            <a href="level_act19mini_st07.html" class="menu-item" style="transform: translate(calc(-50% + 249px), calc(-50% + -312px))">活动19mini_st07</a>
        </div>
    </div>
    <script>
        document.getElementById('menu').addEventListener('click', function() {
            this.classList.toggle('active');
        });
        // 防止点击菜单项时关闭菜单
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        });
    </script>
</body>
</html>
